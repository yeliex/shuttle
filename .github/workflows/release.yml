name: Release Shuttle

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          release_version="${VERSION#v}"
          [[ "$release_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          }
          plugin_version="$(node --print "JSON.parse(require('node:fs').readFileSync('plugins/shuttle/.codex-plugin/plugin.json', 'utf8')).version.split('+')[0]")"
          test "$plugin_version" = "$release_version" || {
            echo "Plugin version $plugin_version does not match release version $release_version" >&2
            exit 1
          }

  release:
    needs: validate
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build ad-hoc signed app
        env:
          VERSION: ${{ github.ref_name }}
        run: pnpm build:macos -- --version "${VERSION#v}" --build "$GITHUB_RUN_NUMBER"

      - name: Generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            -f tag_name="$VERSION" \
            --jq .body \
            > "artifacts/macos/Shuttle-${VERSION#v}.md"
          test -s "artifacts/macos/Shuttle-${VERSION#v}.md"

      - name: Generate signed Sparkle appcast
        env:
          SHUTTLE_SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          VERSION: ${{ github.ref_name }}
        run: pnpm build:appcast -- --version "${VERSION#v}"

      - name: Verify release artifacts
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          codesign --verify --deep --strict --verbose=2 artifacts/macos/Shuttle.app
          test -f "artifacts/release/Shuttle-${VERSION#v}.zip"
          test -s "artifacts/release/Shuttle-${VERSION#v}.md"
          grep -q 'sparkle:edSignature=' artifacts/release/appcast.xml
          grep -q '<description sparkle:format="markdown">' artifacts/release/appcast.xml
          grep -q "releases/download/${VERSION}/Shuttle-${VERSION#v}.zip" artifacts/release/appcast.xml

      - name: Publish latest GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "artifacts/release/Shuttle-${VERSION#v}.zip" \
            artifacts/release/appcast.xml \
            --verify-tag \
            --notes-file "artifacts/release/Shuttle-${VERSION#v}.md" \
            --latest \
            --title "Shuttle ${VERSION#v}"

  container:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/shuttle-relay
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate container metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and publish Relay image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
