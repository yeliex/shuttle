packages:
  - apps/*
  - packages/*

allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: true
  prisma: true
  unrs-resolver: true
  workerd: true

catalog:
  '@types/node': ^24.13.2
  typebox: ^1.3.23
  typescript: ^6.0.3

minimumReleaseAgeExclude:
  - nodemailer@9.1.0

overrides:
  deepmerge-ts@<8.0.0: ^8.0.0
  mysql2@<3.22.0: ^3.22.0
  mysql2@<=3.23.0: ^3.23.1
