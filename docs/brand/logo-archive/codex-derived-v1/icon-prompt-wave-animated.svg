<svg xmlns="http://www.w3.org/2000/svg" viewBox="149 149 418 418" role="img" aria-labelledby="title desc">
  <title id="title">Animated Shuttle icon with prompt and wave</title>
  <desc id="desc">Inside a redrawn loop frame, a blue signal flows across a wave beside a prompt arrow without endpoint circles.</desc>
  <style>
    .signal { animation: signal 2.5s cubic-bezier(.65, 0, .35, 1) infinite; stroke-dasharray: 1; stroke-dashoffset: 1; }
    @keyframes signal {
      0%, 12% { opacity: 0; stroke-dashoffset: 1; }
      20% { opacity: 1; }
      62%, 78% { opacity: 1; stroke-dashoffset: 0; }
      100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .signal { display: none; } }
  </style>
  <path d="M248 248c11-38 46-66 87-66 25 0 47 10 63 26 8-2 16-3 24-3 49 0 88 40 88 89 0 8-1 16-3 24 16 16 26 38 26 63 0 41-28 76-65 87-11 37-46 65-87 65-25 0-47-10-63-26-8 2-16 3-24 3-49 0-88-39-88-88 0-8 1-16 3-24-16-16-26-38-26-63 0-41 28-76 65-87Z" fill="none" stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" stroke-width="22" />
  <path d="M277 309 303.4 357.7c1.2 2.1 1.1 4-.1 6.1L277 410" fill="none" stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" stroke-width="24" />
  <path d="M376 409c15-11 45 11 60 0" fill="none" stroke="#a1a1aa" stroke-linecap="round" stroke-width="16" />
  <path class="signal" d="M376 409c15-11 45 11 60 0" fill="none" pathLength="1" stroke="#5b7cff" stroke-linecap="round" stroke-width="16" />
</svg>
