<svg xmlns="http://www.w3.org/2000/svg" viewBox="240 280 230 160" role="img" aria-labelledby="title desc">
  <title id="title">Animated Shuttle code-to-connection transition</title>
  <desc id="desc">A prompt arrow shrinks into the left endpoint of a wave, a blue signal flows to the right endpoint, then the mark returns to its prompt form.</desc>
  <style>
    .arrow-seed {
      animation: arrow-to-source 5s cubic-bezier(.65, 0, .35, 1) infinite;
      transform-box: fill-box;
      transform-origin: center;
    }
    .connection { animation: connection-center 5s cubic-bezier(.65, 0, .35, 1) infinite; }
    .wave-base { animation: wave-state 5s ease-in-out infinite; }
    .source-node,
    .target-node {
      opacity: 0;
      transform-box: fill-box;
      transform-origin: center;
    }
    .source-node { animation: source-node 5s cubic-bezier(.34, 1.56, .64, 1) infinite; }
    .target-node { animation: target-node 5s cubic-bezier(.34, 1.56, .64, 1) infinite; }
    .signal {
      animation: signal 5s cubic-bezier(.65, 0, .35, 1) infinite;
      opacity: 0;
      stroke-dasharray: 1;
      stroke-dashoffset: 1;
    }
    @keyframes arrow-to-source {
      0%, 10% { opacity: 1; transform: translate(0, 0) scale(1); }
      23% { opacity: .72; transform: translate(20px, 49px) scale(.16); }
      25%, 75% { opacity: 0; transform: translate(20px, 49px) scale(.16); }
      77% { opacity: .72; transform: translate(20px, 49px) scale(.16); }
      90%, 100% { opacity: 1; transform: translate(0, 0) scale(1); }
    }
    @keyframes connection-center {
      0%, 10% { transform: translateX(0); }
      25%, 75% { transform: translateX(-51px); }
      90%, 100% { transform: translateX(0); }
    }
    @keyframes wave-state {
      0%, 10%, 90%, 100% { stroke: #18181b; }
      25%, 75% { stroke: #a1a1aa; }
    }
    @keyframes source-node {
      0%, 12% { opacity: 0; transform: scale(.18); }
      25%, 75% { opacity: 1; transform: scale(1); }
      88%, 100% { opacity: 0; transform: scale(.18); }
    }
    @keyframes target-node {
      0%, 14% { opacity: 0; transform: scale(.18); }
      25%, 75% { opacity: 1; transform: scale(1); }
      86%, 100% { opacity: 0; transform: scale(.18); }
    }
    @keyframes signal {
      0%, 28% { opacity: 0; stroke-dashoffset: 1; }
      32% { opacity: 1; stroke-dashoffset: 1; }
      55%, 68% { opacity: 1; stroke-dashoffset: 0; }
      72%, 100% { opacity: 0; stroke-dashoffset: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .arrow-seed, .signal { display: none; }
      .connection { animation: none; transform: translateX(-51px); }
      .wave-base { animation: none; stroke: #18181b; }
      .source-node, .target-node { animation: none; opacity: 1; transform: none; }
    }
  </style>
  <path class="arrow-seed" d="M277 309 303.4 357.7c1.2 2.1 1.1 4-.1 6.1L277 410" fill="none" stroke="#18181b" stroke-linecap="round" stroke-linejoin="round" stroke-width="24" />
  <g class="connection">
    <path class="wave-base" d="M376 409c15-11 45 11 60 0" fill="none" stroke="#18181b" stroke-linecap="round" stroke-width="16" />
    <path class="signal" d="M376 409c15-11 45 11 60 0" fill="none" pathLength="1" stroke="#5b7cff" stroke-linecap="round" stroke-width="16" />
    <circle class="source-node" cx="361" cy="409" r="11" fill="#fff" stroke="#18181b" stroke-width="8.5" />
    <circle class="target-node" cx="451" cy="409" r="11" fill="#fff" stroke="#18181b" stroke-width="8.5" />
  </g>
</svg>
